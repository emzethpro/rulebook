<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Creator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e0ddd5;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #666;
    }

    input, textarea {
      width: 100%;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      color: #1a1a1a;
      background: #fafaf8;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: #888;
      background: #fff;
    }

    textarea { rows: 4; min-height: 90px; }

    .output-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .output-box {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      background: #f5f5f3;
      border: 1px solid #e0ddd5;
      border-radius: 8px;
      padding: 14px;
      white-space: pre;
      color: #1a1a1a;
      min-height: 80px;
      line-height: 1.7;
      word-break: break-all;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: transparent;
      color: #1a1a1a;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }

    button:hover { background: #f0efe9; }
    button:active { transform: scale(0.98); }

    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 8px;
      background: #e6f3e6;
      color: #2e7d32;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>JSON Creator</h1>

    <div class="field">
      <label for="hook">hook</label>
      <input type="text" id="hook" placeholder="Enter hook value…" oninput="generate()" />
    </div>

    <div class="field">
      <label for="content">content</label>
      <textarea id="content" placeholder="Enter content value…" oninput="generate()"></textarea>
    </div>

    <div class="field">
      <div class="output-label">
        <label>output</label>
      </div>
      <div class="output-box" id="output-box">{ }</div>
    </div>

    <div class="actions">
      <button onclick="copyJSON()">Copy JSON</button>
      <span class="badge" id="copied-badge">Copied!</span>
    </div>
  </div>

  <script>
    function generate() {
      const hook = document.getElementById('hook').value;
      const content = document.getElementById('content').value;
      const obj = { hook, content };
      document.getElementById('output-box').textContent = JSON.stringify(obj, null, 2);
    }

    function copyJSON() {
      const text = document.getElementById('output-box').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const badge = document.getElementById('copied-badge');
        badge.style.opacity = '1';
        setTimeout(() => badge.style.opacity = '0', 1800);
      });
    }

    generate();
  </script>
</body>
</html>
