<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Creator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e0ddd5;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #1a1a1a;
    }

    #units-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .unit-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: #fafaf8;
      border: 1px solid #e0ddd5;
      border-radius: 10px;
      padding: 14px;
    }

    .unit-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .unit-field {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .key-badge {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      background: #eeeae2;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 7px 10px;
      width: 60px;
      flex-shrink: 0;
      text-align: center;
      user-select: none;
      margin-top: 1px;
    }

    textarea {
      flex: 1;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      color: #1a1a1a;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }

    textarea:focus {
      border-color: #888;
    }

    .unit-number {
      font-size: 11px;
      font-weight: 500;
      color: #bbb;
      margin-bottom: 4px;
    }

    .remove-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #e0ddd5;
      background: transparent;
      color: #bbb;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
      line-height: 1;
    }

    .remove-btn:hover { background: #fff0f0; color: #e05252; border-color: #f0c0c0; }
    .remove-btn.hidden { visibility: hidden; pointer-events: none; }

    .divider { height: 1px; background: #eeebe4; }

    .add-btn {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px dashed #bbb;
      background: transparent;
      color: #555;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      align-self: flex-start;
    }

    .add-btn:hover { background: #f5f5f3; border-color: #888; color: #1a1a1a; }

    .output-label {
      font-size: 13px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
    }

    .output-box {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      background: #f5f5f3;
      border: 1px solid #e0ddd5;
      border-radius: 8px;
      padding: 14px;
      white-space: pre;
      color: #1a1a1a;
      min-height: 80px;
      line-height: 1.7;
      word-break: break-all;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copy-btn {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: transparent;
      color: #1a1a1a;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }

    .copy-btn:hover { background: #f0efe9; }
    .copy-btn:active { transform: scale(0.98); }

    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 8px;
      background: #e6f3e6;
      color: #2e7d32;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>JSON Creator</h1>
    <div id="units-list"></div>
    <button class="add-btn" onclick="addUnit()">+ Add unit</button>
    <div class="divider"></div>
    <div>
      <div class="output-label">output</div>
      <div class="output-box" id="output-box">{ }</div>
    </div>
    <div class="actions">
      <button class="copy-btn" onclick="copyJSON()">Copy JSON</button>
      <span class="badge" id="copied-badge">Copied!</span>
    </div>
  </div>

  <script>
    let units = [
      { title: '', content: '' }
    ];

    function escHTML(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function render() {
      const list = document.getElementById('units-list');
      list.innerHTML = '';

      units.forEach((unit, i) => {
        const row = document.createElement('div');
        row.className = 'unit-row';
        row.innerHTML = `
          <div class="unit-fields">
            <div class="unit-number">Unit ${i + 1}</div>
            <div class="unit-field">
              <span class="key-badge">title</span>
              <textarea rows="1" placeholder="Enter title…"
                oninput="updateField(${i}, 'title', this.value)">${escHTML(unit.title)}</textarea>
            </div>
            <div class="unit-field">
              <span class="key-badge">content</span>
              <textarea rows="2" placeholder="Enter content…"
                oninput="updateField(${i}, 'content', this.value)">${escHTML(unit.content)}</textarea>
            </div>
          </div>
          <button class="remove-btn ${units.length <= 1 ? 'hidden' : ''}"
            onclick="removeUnit(${i})" title="Remove">&#215;</button>
        `;
        list.appendChild(row);
      });

      generate();
    }

    function updateField(i, field, val) {
      units[i][field] = val;
      generate();
    }

    function addUnit() {
      units.push({ title: '', content: '' });
      render();
    }

    function removeUnit(i) {
      if (units.length <= 1) return;
      units.splice(i, 1);
      render();
    }

    function generate() {
      const result = units.length === 1
        ? { title: units[0].title, content: units[0].content }
        : units.map(u => ({ title: u.title, content: u.content }));
      document.getElementById('output-box').textContent = JSON.stringify(result, null, 2);
    }

    function copyJSON() {
      const text = document.getElementById('output-box').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const badge = document.getElementById('copied-badge');
        badge.style.opacity = '1';
        setTimeout(() => badge.style.opacity = '0', 1800);
      });
    }

    render();
  </script>
</body>
</html>
